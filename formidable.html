.chip:hover{background:color-mix(in srgb,var(--c) 32%,var(--panel))}.chip.cancelled{text-decoration:line-through;opacity:.65}.chip.postponed{border-style:dashed;opacity:.8}

.info{background:var(--soft);border-left:4px solid var(--accent);padding:.6rem .8rem;border-radius:8px;margin:.5rem 0}.info.warn{border-color:var(--warn)}
.note{font-size:.82rem}

.mhead{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;border-bottom:1px solid var(--line)}.mhead h2{flex:1}.x{border:0;background:none;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.mbody{padding:1rem 1.1rem;overflow:auto;flex:1}.mfoot{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;padding:.75rem 1.1rem;border-top:1px solid var(--line);background:var(--panel);border-radius:0 0 14px 14px}

body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:radial-gradient(900px 520px at 8% -8%,rgba(255,150,200,.30),transparent 60%),radial-gradient(800px 520px at 100% 0,rgba(167,139,250,.28),transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(255,200,160,.28),transparent 60%),var(--bg);background-attachment:fixed}

<noscript>Cette application nécessite JavaScript (aucune donnée n'est envoyée en ligne).</noscript>
<script>/* ===== Lecture / écriture XLSX (100 % local, sans bibliothèque) ===== */
const TD = new TextDecoder(), TE = new TextEncoder();

async function inflateRaw(u8) {
  const s = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}

async function unzip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let e = -1;
  for (let i = u8.length - 22; i >= 0; i--) if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('Fichier non reconnu (ce n\'est pas un classeur .xlsx).');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let i = 0; i < n; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = TD.decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = { method, csize, lho };
    p += 46 + nl + el + cl;
  }
  return {
    names: Object.keys(files),
    async text(name) {
      const f = files[name]; if (!f) return null;
      const l = f.lho, start = l + 30 + dv.getUint16(l + 26, true) + dv.getUint16(l + 28, true);
      let d = u8.subarray(start, start + f.csize);
      if (f.method === 8) d = await inflateRaw(d);
      return TD.decode(d);
    }
  };
}

const colNum = ref => { const m = /^([A-Z]+)(\d+)$/.exec(ref); let c = 0; for (const ch of m[1]) c = c * 26 + ch.charCodeAt(0) - 64; return { c, r: +m[2] }; };
const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; } return s; };
const xml = t => new DOMParser().parseFromString(t, 'application/xml');
const relsMap = d => { const m = {}; for (const r of d.getElementsByTagName('Relationship')) m[r.getAttribute('Id')] = { target: r.getAttribute('Target'), type: r.getAttribute('Type') }; return m; };
const resolvePath = (base, t) => { if (t.startsWith('/')) return t.slice(1); const parts = base.split('/'); parts.pop(); for (const s of t.split('/')) { if (s === '..') parts.pop(); else if (s !== '.') parts.push(s); } return parts.join('/'); };

async function readXlsx(buf) {
  const z = await unzip(buf);
  const wb = xml(await z.text('xl/workbook.xml'));
  const wbRels = relsMap(xml(await z.text('xl/_rels/workbook.xml.rels')));
  const ssT = await z.text('xl/sharedStrings.xml');
  const shared = ssT ? [...xml(ssT).getElementsByTagName('si')].map(si => [...si.getElementsByTagName('t')].map(t => t.textContent).join('')) : [];
  const sheets = [];
  for (const s of wb.getElementsByTagName('sheet')) {
    const rid = s.getAttribute('r:id') || s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
    const path = resolvePath('xl/workbook.xml', wbRels[rid].target);
    const d = xml(await z.text(path));
    const cells = new Map();
    for (const c of d.getElementsByTagName('c')) {
      const { c: cc, r } = colNum(c.getAttribute('r'));
      const t = c.getAttribute('t'), vEl = c.getElementsByTagName('v')[0];
      let v = null;
      if (t === 'inlineStr') v = [...c.getElementsByTagName('t')].map(x => x.textContent).join('');
      else if (vEl) { v = vEl.textContent; if (t === 's') v = shared[+v]; else if (t === 'str' || t === 'e') v = v; else if (t === 'b') v = v === '1'; else v = Number(v); }
      if (v !== null && v !== '') cells.set(r + ',' + cc, v);
    }
    // commentaires
    const comments = [];
    const relPath = path.replace(/worksheets\/(.*)\.xml$/, 'worksheets/_rels/$1.xml.rels');
    const relT = await z.text(relPath);
    if (relT) for (const r of Object.values(relsMap(xml(relT)))) {
      if (!/\/comments$/.test(r.type)) continue;
      const cd = xml(await z.text(resolvePath(path, r.target)));
      for (const cm of cd.getElementsByTagName('comment')) {
        let txt = [...cm.getElementsByTagName('t')].map(x => x.textContent).join('');
        const m = /Commentaire\s*:\s*([\s\S]*)$/.exec(txt);
        if (m) txt = m[1];
        txt = txt.split('\n').map(l => l.trim()).filter(Boolean).join('\n');
        comments.push({ ...colNum(cm.getAttribute('ref')), text: txt });
      }
    }
    sheets.push({ name: s.getAttribute('name'), cells, comments, get: (r, c) => cells.get(r + ',' + c), maxCol: Math.max(0, ...[...cells.keys()].map(k => +k.split(',')[1])), maxRow: Math.max(0, ...[...cells.keys()].map(k => +k.split(',')[0])) });
  }
  return sheets;
}

/* --- écriture --- */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = 0xffffffff; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };

function zipStore(files) { // files: [{name, data:Uint8Array}]
  const parts = [], central = []; let off = 0;
  for (const f of files) {
    const nm = TE.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0x5821, true); lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true);
    lh.setUint16(26, nm.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), nm, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, 0, true); ch.setUint16(14, 0x5821, true); ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30 + nm.length + n;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' });
}

const xesc = s => String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/** sheets: [{name, rows:[[...]]}] ; 1ère ligne = en-têtes. Valeurs : string | number | Date | null */
function buildXlsx(sheets) {
  const used = new Set();
  const safe = sheets.map((s, i) => {
    let n = String(s.name || 'Feuille' + (i + 1)).replace(/[:\\\/?*\[\]]/g, '-').slice(0, 31) || 'Feuille';
    let k = n, j = 2; while (used.has(k.toLowerCase())) k = n.slice(0, 28) + ' ' + j++;
    used.add(k.toLowerCase()); return { ...s, name: k };
  });
  const files = [];
  const add = (name, text) => files.push({ name, data: TE.encode(text) });
  add('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' + safe.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('') + '</Types>');
  add('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  add('xl/workbook.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' + safe.map((s, i) => `<sheet name="${xesc(s.name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('') + '</sheets></workbook>');
  add('xl/_rels/workbook.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' + safe.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('') + `<Relationship Id="rId${safe.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`);
  add('xl/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="dd/mm/yyyy"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F4E79"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs></styleSheet>');
  safe.forEach((s, i) => {
    const widths = [];
    const rows = s.rows.map((row, ri) => '<row r="' + (ri + 1) + '">' + row.map((v, ci) => {
      if (v === null || v === undefined || v === '') return '';
      const ref = colName(ci + 1) + (ri + 1);
      let len;
      let out;
      if (v instanceof Date) { out = `<c r="${ref}" s="2"><v>${Date.UTC(v.getFullYear(), v.getMonth(), v.getDate()) / 86400000 + 25569}</v></c>`; len = 10; }
      else if (typeof v === 'number') { out = `<c r="${ref}"${ri === 0 ? ' s="1"' : ''}><v>${v}</v></c>`; len = String(v).length; }
      else { const t = String(v); out = `<c r="${ref}" t="inlineStr"${ri === 0 ? ' s="1"' : ''}><is><t xml:space="preserve">${xesc(t)}</t></is></c>`; len = Math.max(...t.split('\n').map(x => x.length)); }
      widths[ci] = Math.max(widths[ci] || 8, Math.min(60, len + 2));
      return out;
    }).join('') + '</row>').join('');
    const cols = '<cols>' + widths.map((w, ci) => `<col min="${ci + 1}" max="${ci + 1}" width="${w || 8}" customWidth="1"/>`).join('') + '</cols>';
    add(`xl/worksheets/sheet${i + 1}.xml`, `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols}<sheetData>${rows}</sheetData></worksheet>`);
  });
  return zipStore(files);
}

'use strict';
/* ===== Utilitaires ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => toISO(new Date());
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); };
const startOfWeek = iso => { const d = parseISO(iso); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return toISO(d); };
const fmtDate = (iso, o) => iso ? parseISO(iso).toLocaleDateString('fr-FR', o || { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtShort = iso => iso ? parseISO(iso).toLocaleDateString('fr-FR') : '';
const fmtH = h => { const m = Math.round((h || 0) * 60), hh = Math.floor(m / 60), mm = m % 60; return mm ? `${hh} h ${pad(mm)}` : `${hh} h`; };
const t2m = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const lev = (a, b) => { const m = a.length, n = b.length; if (!m) return n; if (!n) return m; let p = Array.from({ length: n + 1 }, (_, i) => i); for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; } return p[n]; };
const sum = (a, f) => a.reduce((x, y) => x + (f ? f(y) : y), 0);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }

/* ===== Référentiels fixes ===== */
const STATUTS = [
  { id: 'a_planifier', label: 'À planifier', color: '#9a8fb0', glyph: '○' },
  { id: 'planifiee', label: 'Planifiée', color: '#7c6cf0', glyph: '◔' },
  { id: 'confirmee', label: 'Confirmée', color: '#12a69a', glyph: '◑' },
  { id: 'realisee', label: 'Réalisée', color: '#2fb36d', glyph: '●' },
  { id: 'reportee', label: 'Reportée', color: '#f29e4c', glyph: '↻' },
  { id: 'annulee', label: 'Annulée', color: '#e5487a', glyph: '✕' }
];
const ST = Object.fromEntries(STATUTS.map(s => [s.id, s]));
const ROLES = { admin: 'Administrateur', gestionnaire: 'Gestionnaire', animateur: 'Animateur', manager: 'Manager / pilote', lecteur: 'Lecteur' };
const PALETTE = ['#e0539a', '#8b5cf6', '#14b8a6', '#f59e42', '#f472b6', '#6366f1', '#84cc16', '#06b6d4'];
const PENDING = ['a_planifier', 'planifiee', 'confirmee'];
const ACTIVE = ['a_planifier', 'planifiee', 'confirmee', 'realisee'];

/* ===== Base de données (stockage local du navigateur) ===== */
let DB = null;
const KEY = 'formidable.db.v1';
const S = { user: null, view: 'dashboard', F: {}, cal: { mode: 'month', date: today(), group: '', color: 'statut' }, sort: { k: 'date', d: 1 }, setTab: 'types' };

function newDB() {
  return {
    v: 1, settingsMod: '', del: {},
    settings: {
      org: '', alertDays: 7,
      types: [{ id: uid(), name: 'Néo', color: PALETTE[0] }, { id: uid(), name: 'SPECIFICA', color: PALETTE[1] }, { id: uid(), name: 'Collectif Agence', color: PALETTE[3] }],
      themes: [], equipes: [], populations: ['Nouveaux collaborateurs', 'Conseillers', 'Managers'],
      durees: [{ l: 'Demi-journée', h: 3 }, { l: 'Journée', h: 7 }]
    },
    lieux: ['Aiguille de Bionnassay|salle', 'Cirque du Fer à Cheval|salle', 'Dôme du Goûter|salle', 'Agence Annecy Saint-François|agence', 'Agence de Saint-Michel-de-Maurienne|agence'].map(x => { const [name, kind] = x.split('|'); return { id: uid(), name, kind, adresse: '', secteur: '', lien: '', aliases: [], mod: '' }; }),
    animateurs: [], users: [], sessions: [], history: []
  };
}

/* ===== Fichier de données partagé (File System Access API) ===== */
const FS = { h: null, mod: 0, msg: '', timer: null };

    const f = await FS.h.getFile();

function filtered(list = DB.sessions, f = curF()) {

/* ===== Alertes ===== */
function computeAlerts() {
  const out = [], t = today(), soon = addDays(t, DB.settings.alertDays || 7);
  const act = DB.sessions.filter(s => ['a_planifier', 'planifiee', 'confirmee', 'realisee'].includes(s.statut));
  for (const s of DB.sessions) {
    if (s.statut === 'annulee' || s.statut === 'reportee') continue;
    if (!s.titulaireId) out.push({ sev: 'warn', kind: 'Animateur manquant', sid: s.id, msg: 'Aucun animateur titulaire désigné.' });
    else if (!s.suppleantId && s.statut !== 'realisee') out.push({ sev: 'info', kind: 'Suppléant manquant', sid: s.id, msg: 'Aucun suppléant prévu.' });
    if (s.date < t && PENDING.includes(s.statut)) out.push({ sev: 'warn', kind: 'À confirmer', sid: s.id, msg: 'Session passée non confirmée comme réalisée.' });
    if (s.date >= t && s.date <= soon && s.statut !== 'a_planifier') { const n = Math.round((parseISO(s.date) - parseISO(t)) / 864e5); out.push({ sev: 'rappel', kind: 'Rappel', sid: s.id, msg: n === 0 ? 'Session aujourd\'hui.' : `Session dans ${n} jour${n > 1 ? 's' : ''}.` }); }
  }
  const byDate = {};
  act.forEach(s => (byDate[s.date] ||= []).push(s));
  const overlap = (a, b) => { const a1 = t2m(a.debut), a2 = t2m(a.fin), b1 = t2m(b.debut), b2 = t2m(b.fin); if (a1 !== null && a2 !== null && b1 !== null && b2 !== null) return a1 < b2 && b1 < a2; return (a.duree || 0) + (b.duree || 0) > 7.5; };
  for (const list of Object.values(byDate)) for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const a = list[i], b = list[j]; if (!overlap(a, b)) continue;
    const ea = effective(a), common = ea.filter(x => effective(b).includes(x));
    if (common.length) { const m = `Conflit : ${common.map(animName).join(', ')} est aussi sur « ${sessionLabel(b)} ».`; out.push({ sev: 'warn', kind: 'Conflit animateur', sid: a.id, msg: m }); out.push({ sev: 'warn', kind: 'Conflit animateur', sid: b.id, msg: `Conflit : ${common.map(animName).join(', ')} est aussi sur « ${sessionLabel(a)} ».` }); }
    const l = a.lieuId && a.lieuId === b.lieuId && a.modalite !== 'distance' && b.modalite !== 'distance' ? L(a.lieuId) : null;
    if (l && l.kind === 'salle') { out.push({ sev: 'warn', kind: 'Conflit de salle', sid: a.id, msg: `Salle « ${l.name} » déjà prise par « ${sessionLabel(b)} ».` }); out.push({ sev: 'warn', kind: 'Conflit de salle', sid: b.id, msg: `Salle « ${l.name} » déjà prise par « ${sessionLabel(a)} ».` }); }
  }
  return out.sort((x, y) => (x.sev === y.sev ? 0 : x.sev === 'warn' ? -1 : x.sev === 'info' ? (y.sev === 'warn' ? 1 : -1) : 1) || (DB.sessions.find(s => s.id === x.sid).date < DB.sessions.find(s => s.id === y.sid).date ? -1 : 1));
}
const conflictsFor = s => computeAlerts().filter(a => a.sid === s.id && a.kind.startsWith('Conflit'));

/* ===== Statistiques ===== */
function stats(list) {
  const r = { n: list.length, st: Object.fromEntries(STATUTS.map(s => [s.id, 0])), hPlan: 0, hReal: 0, prevus: 0, presents: 0, partN: 0, anim: {}, type: {}, lieu: {}, secteur: {}, mois: {} };
  const ent = (o, k, name) => o[k] ||= { name, prev: 0, real: 0, hPrev: 0, hReal: 0, ann: 0, rep: 0 };
  for (const s of list) {
    r.st[s.statut]++;
    const active = ACTIVE.includes(s.statut), done = s.statut === 'realisee';
    const h = s.duree || 0, hr = dureeEff(s);
    if (active) r.hPlan += h;
    if (done) { r.hReal += hr; if (s.prevus != null) r.prevus += +s.prevus; if (s.presents != null) { r.presents += +s.presents; r.partN++; } }
    const targets = [['type', s.typeId, typeName(s.typeId)], ['lieu', s.modalite === 'distance' ? 'dist' : (s.lieuId || '-'), lieuName(s) || 'Non renseigné'], ['secteur', ((L(s.lieuId) || {}).secteur || (s.modalite === 'distance' ? 'À distance' : 'Non renseigné')), ((L(s.lieuId) || {}).secteur || (s.modalite === 'distance' ? 'À distance' : 'Non renseigné'))]];
    for (const [g, k, nm] of targets) { const e = ent(r[g], k, nm); if (active) { e.prev++; e.hPrev += h; } if (done) { e.real++; e.hReal += hr; } if (s.statut === 'annulee') e.ann++; if (s.statut === 'reportee') e.rep++; }
    const who = effective(s).length ? effective(s) : [''];
    for (const a of who) { const e = ent(r.anim, a || '-', a ? animName(a) : 'Non attribué'); if (active) { e.prev++; e.hPrev += h; } if (done) { e.real++; e.hReal += hr; } if (s.statut === 'annulee') e.ann++; if (s.statut === 'reportee') e.rep++; }
    const m = s.date.slice(0, 7); r.mois[m] ||= Object.fromEntries(STATUTS.map(x => [x.id, 0])); r.mois[m][s.statut]++;
  }
  r.taux = r.prevus ? r.presents / r.prevus : null;
  return r;
}

/* ===== Import du planning Excel « Néo » ===== */
function excelDate(v) {
  if (typeof v === 'number' && v > 30000) { const d = new Date(Math.round((v - 25569) * 86400) * 1000); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
  if (typeof v === 'string') { const m = /^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/.exec(v.trim()); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`; if (/^\d{4}-\d{2}-\d{2}$/.test(v.trim())) return v.trim(); }
  return null;
}
function excelHours(v) {

  if (typeof v === 'string') { const m = /^(\d{1,2})\s*[h:]\s*(\d{0,2})/i.exec(v.trim()); if (m) return +m[1] + (+m[2] || 0) / 60; const n = parseFloat(v.replace(',', '.')); return isNaN(n) ? null : n; }
  return null;
}
const cleanName = s => String(s ?? '').replace(/\s+/g, ' ').trim();
const lieuKey = s => norm(s).replace(/\bst\b/g, 'saint').replace(/\bstes?\b/g, 'sainte').replace(/\baiguilles\b/g, 'aiguille').replace(/\b(de|du|des|d|la|le|les)\b/g, ' ').replace(/\s+/g, ' ').trim();

/** Analyse un classeur au format « Planning formation » → { sessions, notes, warnings } (références par nom, résolues à l'application) */
function parseNeo(sheets) {
  const out = { rows: [], notes: [], warn: [] };
  for (const sh of sheets) {
    const blocks = [];
    for (let r = 1; r <= sh.maxRow; r++) {
      if (norm(sh.get(r, 3)) !== 'salles') continue;
      const b = { sheet: sh.name, roomRow: r, dateRow: r - 1, year: sh.get(r, 2) };
      for (let rr = r + 1; rr <= r + 8; rr++) {
        const lab = norm(sh.get(rr, 2) ?? sh.get(rr, 3));
        if (lab === 'animateurs') break;
        if (lab.startsWith('type')) b.typeRow = rr; else if (lab.startsWith('duree')) b.dureeRow = rr; else if (lab.includes('titulaire')) b.titRow = rr; else if (lab.includes('suppleant')) b.suppRow = rr;
      }
      blocks.push(b);
    }
    if (!blocks.length) { out.warn.push(`Feuille « ${sh.name} » ignorée : aucun bloc « Salles » reconnu.`); continue; }
    for (const b of blocks) {
      b.cols = {};
      for (let c = 4; c <= sh.maxCol; c++) {
        const date = excelDate(sh.get(b.dateRow, c)); if (!date) continue;
        const room = cleanName(sh.get(b.roomRow, c));
        const cancelled = norm(room).includes('annul');
        const row = { date, lieu: cancelled ? '' : room, annulee: cancelled, type: cleanName(sh.get(b.typeRow, c)), duree: excelHours(sh.get(b.dureeRow, c)), titulaire: cleanName(sh.get(b.titRow, c)), suppleant: cleanName(sh.get(b.suppRow, c)), commentaire: '', ref: `${sh.name}!${colName(c)}${b.roomRow}` };
        b.cols[c] = row; out.rows.push(row);
      }
      b.rowsAnim = [];
    }
    for (const cm of sh.comments) {
      const blk = blocks.find(b => b.roomRow === cm.r && b.cols[cm.c]);
      if (blk) { blk.cols[cm.c].commentaire = cm.text; continue; }
      const name = cleanName(sh.get(cm.r, cm.c));
      if (name) out.notes.push({ name, text: cm.text });
    }
  }
  return out;
}

/** Applique l'import (retourne un compte rendu). opts: { pastDone, skipDup } */
function applyNeo(parsed, opts) {
  const rep = { added: 0, dup: 0, newAnim: [], newLieu: [], newType: [], lieuMap: {} };
  const findLieu = raw => {
    const k = lieuKey(raw); if (!k) return null;
    let best = null, bd = 99;
    for (const l of DB.lieux) for (const nm of [l.name, ...(l.aliases || [])]) { const kk = lieuKey(nm), d = k === kk ? 0 : lev(k, kk); if (d < bd) { bd = d; best = l; } }
    if (best && bd <= Math.max(1, Math.floor(k.length / 12))) return best;
    return null;
  };
  const getLieu = raw => {
    let l = findLieu(raw);
    if (!l) { l = stamp({ id: uid(), name: raw, kind: /agence/i.test(raw) ? 'agence' : 'salle', adresse: '', secteur: '', lien: '', aliases: [] }); DB.lieux.push(l); rep.newLieu.push(raw); }
    else if (l.name !== raw && !(l.aliases || []).includes(raw) && norm(l.name) !== norm(raw)) { (l.aliases ||= []).push(raw); stamp(l); }
    (rep.lieuMap[l.name] ||= new Set()).add(raw);
    return l;
  };
  const getAnim = raw => { if (!raw) return ''; let a = DB.animateurs.find(x => norm(x.name) === norm(raw)); if (!a) { a = stamp({ id: uid(), name: raw, equipe: '', email: '', actif: true, note: '' }); DB.animateurs.push(a); rep.newAnim.push(raw); } return a.id; };
  const getType = raw => { if (!raw) return ''; let t = DB.settings.types.find(x => norm(x.name) === norm(raw)); if (!t) { t = { id: uid(), name: raw, color: PALETTE[DB.settings.types.length % PALETTE.length] }; DB.settings.types.push(t); touchSettings(); rep.newType.push(raw); } return t.id; };
  const t0 = today();
  for (const r of parsed.rows) {
    const typeId = getType(r.type), lieu = r.lieu ? getLieu(r.lieu) : null, tit = getAnim(r.titulaire), sup = getAnim(r.suppleant);
    if (opts.skipDup && DB.sessions.some(s => s.date === r.date && s.typeId === typeId && s.lieuId === (lieu ? lieu.id : '') && s.titulaireId === tit)) { rep.dup++; continue; }
    const statut = r.annulee ? 'annulee' : (opts.pastDone && r.date < t0 ? 'realisee' : 'planifiee');
    const duree = r.duree ?? (typeId && /specifica/i.test(typeName(typeId)) ? 3.5 : 7);
    const s = newSession({ date: r.date, typeId, titre: typeName(typeId) + (lieu ? ' – ' + lieu.name : ''), duree: r.annulee && r.duree == null ? 0 : duree, dureeReelle: statut === 'realisee' ? duree : null, statut, lieuId: lieu ? lieu.id : '', titulaireId: tit, suppleantId: sup, commentaire: r.commentaire, motif: r.annulee ? 'Session annulée (mention du fichier Excel d\'origine)' : '', decisionPar: r.annulee ? (S.user ? S.user.name : '') : '', origine: 'Import Excel ' + r.ref });
    stamp(s); DB.sessions.push(s); logH('Création', s, 'Import du planning Excel'); rep.added++;
  }
  for (const n of parsed.notes) { const a = DB.animateurs.find(x => norm(x.name) === norm(n.name)); if (a && !(a.note || '').includes(n.text)) { a.note = ((a.note ? a.note + '\n' : '') + n.text); stamp(a); } }
  return rep;
}

    body = `<div class="scroll"><table class="rgrid"><thead><tr><th class="rname"></th>${Array.from({ length: nd }, (_, i) => { const d = `${ym}-${pad(i + 1)}`; return `<th class="${[0, 6].includes(parseISO(d).getDay()) ? 'we' : ''}${d === t ? ' today' : ''}"><small>${['D', 'L', 'M', 'M', 'J', 'V', 'S'][parseISO(d).getDay()]}</small>${i + 1}</th>`; }).join('')}<th>Σ h</th></tr></thead><tbody>${rowsData.map(([id, n, ss]) => `<tr><th class="rname">${esc(n)}</th>${Array.from({ length: nd }, (_, i) => { const d = `${ym}-${pad(i + 1)}`, x = ss.filter(s => s.date === d); return `<td class="${[0, 6].includes(parseISO(d).getDay()) ? 'we' : ''}">${x.map(s => `<button class="rc${s.statut === 'annulee' ? ' cancelled' : ''}" style="--c:${S.cal.color === 'type' ? (T(s.typeId) || {}).color : ST[s.statut].color}" data-act="open" data-id="${s.id}" title="${esc(sessionLabel(s) + ' · ' + ST[s.statut].label)}">${esc((typeName(s.typeId)).slice(0, 3))}</button>`).join('')}</td>`; }).join('')}<td class="n">${fmtH(sum(ss.filter(s => ACTIVE.includes(s.statut)), dureeEff))}</td></tr>`).join('') || `<tr><td colspan="${nd + 2}" class="muted">Aucune session.</td></tr>`}</tbody></table></div>`;
  }
  const legend = S.cal.color === 'type' ? DB.settings.types.map(t => `<span><i style="background:${t.color}"></i>${esc(t.name)}</span>`).join('') : STATUTS.map(s => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join('');
  return `<div class="page-h"><div><h1>Planning</h1></div><div class="actions noprint">${can.edit() ? '<button class="btn primary" data-act="new">+ Nouvelle session</button>' : ''}${can.exp() ? '<button class="btn" data-act="exportIcs" title="Fichier calendrier (.ics) pour Outlook">Export calendrier</button>' : ''}</div></div>${filterBar(false)}${calNav()}<div class="legend">${legend}</div>${body}`;
}

/* ===== Liste des sessions ===== */
function viewSessions() {
  const list = filtered(), k = S.sort.k, d = S.sort.d;
  const val = { date: s => s.date + (s.debut || ''), type: s => typeName(s.typeId), lieu: s => lieuName(s), tit: s => animName(s.titulaireId), duree: s => s.duree || 0, statut: s => STATUTS.findIndex(x => x.id === s.statut) }[k];
  list.sort((a, b) => (val(a) < val(b) ? -1 : val(a) > val(b) ? 1 : 0) * d);
  const alerts = computeAlerts(), warn = new Set(alerts.filter(a => a.sev === 'warn').map(a => a.sid));
  const th = (key, l, cls = '') => `<th class="${cls}"><button class="sortb" data-act="sort" data-k="${key}">${l}${k === key ? (d > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
  return `<div class="page-h"><div><h1>Sessions</h1><p class="muted">${list.length} session${list.length > 1 ? 's' : ''} · ${fmtH(sum(list.filter(s => ACTIVE.includes(s.statut)), dureeEff))} (hors annulées/reportées)</p></div><div class="actions noprint">${can.edit() ? '<button class="btn primary" data-act="new">+ Nouvelle session</button>' : ''}${can.exp() ? '<button class="btn" data-act="exportSessions">Exporter (Excel)</button>' : ''}</div></div>${filterBar(true, true)}
  <div class="scroll"><table class="tbl hover"><thead><tr>${th('date', 'Date')}<th>Horaires</th>${th('type', 'Formation')}${th('lieu', 'Lieu')}${th('tit', 'Titulaire')}<th>Suppléant</th>${th('duree', 'Durée', 'n')}<th class="n">Particip.</th>${th('statut', 'Statut')}<th></th></tr></thead><tbody>${list.map(s => `<tr data-act="open" data-id="${s.id}" tabindex="0"><td>${fmtDate(s.date, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</td><td>${s.debut ? s.debut + (s.fin ? '–' + s.fin : '') : '<span class="muted">—</span>'}</td><td>${typeDot(s.typeId)}<b>${esc(s.titre || typeName(s.typeId))}</b>${s.groupeId ? ' <span class="tag" title="Session d\'une action à sessions multiples">série</span>' : ''}<br><small class="muted">${esc(typeName(s.typeId))}${s.theme ? ' · ' + esc(s.theme) : ''}</small></td><td>${esc(lieuName(s)) || '<span class="muted">—</span>'}</td><td>${esc(animName(s.titulaireId)) || '<span class="warnt">à désigner</span>'}</td><td>${esc(animName(s.suppleantId)) || '<span class="muted">—</span>'}</td><td class="n">${fmtH(dureeEff(s))}</td><td class="n">${s.presents != null ? s.presents : '–'} / ${s.prevus != null ? s.prevus : '–'}</td><td>${statutBadge(s.statut)}</td><td>${warn.has(s.id) ? '<span class="warnt" title="Alerte : voir l\'onglet Alertes">⚠</span>' : ''}</td></tr>`).join('') || '<tr><td colspan="10" class="muted pad">Aucune session ne correspond aux filtres.</td></tr>'}</tbody></table></div>`;
}

/* ===== Alertes & historique ===== */
function viewAlertes() {
  const al = computeAlerts(), groups = { warn: 'À traiter', info: 'Informations', rappel: 'Rappels à venir' };
  return `<div class="page-h"><div><h1>Alertes</h1><p class="muted">Calculées en direct sur l'ensemble des sessions. Rappels : sessions dans les ${DB.settings.alertDays} prochains jours.</p></div></div>` + Object.entries(groups).map(([sev, label]) => { const items = al.filter(a => a.sev === sev); return `<div class="card"><h3>${label} <span class="tag">${items.length}</span></h3>${items.map(a => { const s = DB.sessions.find(x => x.id === a.sid); return `<div class="alert ${sev}" data-act="open" data-id="${s.id}" tabindex="0"><b>${esc(a.kind)}</b> <span>${esc(sessionLabel(s))}</span><em>${esc(a.msg)}</em></div>`; }).join('') || '<p class="muted">Rien à signaler.</p>'}</div>`; }).join('');
}
function viewHistorique() {
  const q = norm(S.hq || ''), h = [...DB.history].reverse().filter(x => !q || norm([x.user, x.label, x.action, x.detail].join(' ')).includes(q)).slice(0, 500);
  return `<div class="page-h"><div><h1>Historique des modifications</h1><p class="muted">Journal de toutes les créations, modifications, changements de statut et d'animateur.</p></div><div class="actions noprint"><input type="search" data-hq placeholder="Rechercher (personne, session, statut…)" value="${esc(S.hq || '')}">${can.exp() ? '<button class="btn" data-act="exportHist">Exporter (Excel)</button>' : ''}</div></div>
  <div class="scroll"><table class="tbl"><thead><tr><th>Date / heure</th><th>Utilisateur</th><th>Action</th><th>Session</th><th>Détail</th></tr></thead><tbody>${h.map(x => `<tr><td>${new Date(x.ts).toLocaleString('fr-FR')}</td><td>${esc(x.user)}</td><td><span class="tag">${esc(x.action)}</span></td><td>${x.sid && DB.sessions.some(s => s.id === x.sid) ? `<a href="#" data-act="open" data-id="${x.sid}">${esc(x.label)}</a>` : esc(x.label)}</td><td class="pre">${esc(x.detail)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted pad">Aucun événement.</td></tr>'}</tbody></table></div>${DB.history.length > 500 ? '<p class="muted">Seuls les 500 derniers événements sont affichés ; l\'export contient tout.</p>' : ''}`;
}

  ${can.imp() ? `<div class="card"><h3>Fichier de données partagé</h3>
    <p>Les données vivent dans le navigateur de chaque poste. Pour travailler à plusieurs, liez l'application à <b>un fichier .json placé sur un dossier partagé</b> de l'entreprise : chaque modification y est enregistrée et fusionnée automatiquement avec celles des collègues (même session modifiée par deux personnes : la plus récente l'emporte). Les droits d'accès au dossier protègent les données.</p>
    ${FS_OK ? `<p>État : ${FS.h ? `<b>lié à ${esc(FS.h.name)}</b>` : '<b>aucun fichier lié</b> (données locales à ce navigateur)'}</p><div class="actions wrap"><button class="btn primary" data-act="fslink" data-v="new">Créer le fichier partagé…</button><button class="btn" data-act="fslink" data-v="open">Ouvrir un fichier existant…</button>${FS.h ? '<button class="btn danger ghost" data-act="fsunlink">Délier</button>' : ''}</div>` : '<p class="info warn">Cette fonction nécessite Chrome ou Edge. Avec un autre navigateur, utilisez les sauvegardes ci-dessous.</p>'}</div>
  <div class="card"><h3>Sauvegarde et restauration</h3><p>Copie complète de l'application (sessions, référentiels, utilisateurs, historique). Il est recommandé de protéger la sauvegarde par un mot de passe (chiffrement AES-256).</p>

}

/* ===== Paramètres ===== */
function viewSettings() {
  const tabs = [['types', 'Types de formation'], ['lieux', 'Lieux'], ['animateurs', 'Animateurs'], ['listes', 'Thèmes, équipes, populations'], ['durees', 'Durées types']].concat(can.admin() ? [['users', 'Utilisateurs & droits'], ['general', 'Général']] : []);
  const tab = tabs.some(t => t[0] === S.setTab) ? S.setTab : 'types';
  const used = { type: id => DB.sessions.filter(s => s.typeId === id).length, lieu: id => DB.sessions.filter(s => s.lieuId === id).length, anim: id => DB.sessions.filter(s => involved(s).includes(id)).length };

  if (tab === 'listes') body = [['themes', 'Thèmes / produits'], ['equipes', 'Équipes / unités'], ['populations', 'Populations concernées']].map(([k, l]) => `<div class="card"><h3>${l}</h3><div class="checks">${DB.settings[k].map((v, i) => `<span class="tag lg">${esc(v)} <button class="lnk" data-act="listren" data-k="${k}" data-i="${i}">modifier</button> <button class="lnk" data-act="listdel" data-k="${k}" data-i="${i}">retirer</button></span>`).join('') || '<small class="muted">Liste vide.</small>'}</div><div class="adddates"><input id="add-${k}" placeholder="Nouvelle valeur"><button class="btn" data-act="listadd" data-k="${k}">Ajouter</button></div></div>`).join('');
  if (tab === 'durees') body = `<p class="muted">Raccourcis proposés dans la fiche session (ex. demi-journée = 3 h, journée = 7 h). La durée reste libre.</p><table class="tbl"><thead><tr><th>Libellé</th><th class="n">Heures</th><th></th></tr></thead><tbody>${DB.settings.durees.map((x, i) => `<tr><td>${esc(x.l)}</td><td class="n">${x.h}</td><td class="r"><button class="btn sm" data-act="edit" data-k="duree" data-id="${i}">Modifier</button> <button class="btn sm danger ghost" data-act="rm" data-k="duree" data-id="${i}">Supprimer</button></td></tr>`).join('')}</tbody></table><button class="btn primary" data-act="edit" data-k="duree">+ Durée type</button>`;
  if (tab === 'users') body = `<p class="info">Les profils servent à adapter l'écran à chacun (qui peut modifier, exporter, paramétrer). Ils ne constituent pas une protection cryptographique : les données sont stockées dans le navigateur ou dans le fichier partagé, dont l'accès doit être protégé par les droits du dossier réseau.</p><table class="tbl"><thead><tr><th>Nom</th><th>Profil</th><th>Animateur lié</th><th>Code</th><th></th></tr></thead><tbody>${DB.users.map(u => `<tr><td>${esc(u.name)}</td><td>${ROLES[u.role]}</td><td>${esc(animName(u.animateurId))}</td><td>${u.pin ? 'oui' : '<span class="warnt">aucun</span>'}</td><td class="r"><button class="btn sm" data-act="edit" data-k="user" data-id="${u.id}">Modifier</button> <button class="btn sm danger ghost" data-act="rm" data-k="user" data-id="${u.id}">Supprimer</button></td></tr>`).join('')}</tbody></table><button class="btn primary" data-act="edit" data-k="user">+ Utilisateur</button>
    <table class="tbl" style="margin-top:1.5rem"><caption>Droits par profil</caption><thead><tr><th>Profil</th><th>Droits</th></tr></thead><tbody><tr><td>Administrateur</td><td>Tout : paramétrage, utilisateurs, sessions, import/export, sauvegardes</td></tr><tr><td>Gestionnaire</td><td>Création/modification/suppression des sessions, référentiels (types, lieux, animateurs), import Excel, exports, fichier partagé</td></tr><tr><td>Animateur</td><td>Consultation ; mise à jour de ses propres interventions (statut, durée réelle, participants, commentaires, documents)</td></tr><tr><td>Manager / pilote</td><td>Consultation, tableaux de bord, historique, exports</td></tr><tr><td>Lecteur</td><td>Consultation uniquement</td></tr></tbody></table>`;
  if (tab === 'general') body = `<div class="card"><label class="f"><span>Nom de l'équipe / entité (affiché sur les bilans)</span><input id="set-org" value="${esc(DB.settings.org)}"></label><label class="f"><span>Rappel avant session (jours)</span><input id="set-days" type="number" min="1" max="60" value="${DB.settings.alertDays}"></label><button class="btn primary" data-act="saveGeneral">Enregistrer</button></div><div class="card"><h3>Zone sensible</h3><p>Efface <b>toutes</b> les données de ce navigateur (sessions, référentiels, utilisateurs).</p><button class="btn danger" data-act="wipe">Réinitialiser l'application…</button></div>`;
  return `<div class="page-h"><div><h1>Paramètres</h1></div></div><div class="seg tabs">${tabs.map(([k, l]) => `<button class="${k === tab ? 'on' : ''}" data-act="settab" data-v="${k}">${l}</button>`).join('')}</div><div class="card">${body}</div>`;

/* ===== Rendu général ===== */
const NAV = [['dashboard', '🌸 Tableau de bord', () => true], ['planning', '🗓️ Planning', () => true], ['sessions', '📋 Sessions', () => true], ['alertes', '🔔 Alertes', () => true], ['historique', '🕘 Historique', () => can.hist()], ['echanges', '📥 Import / Export', () => can.imp() || can.exp()], ['settings', '⚙️ Paramètres', () => can.refs()]];
const VIEWS = { dashboard: viewDashboard, planning: viewPlanning, sessions: viewSessions, alertes: viewAlertes, historique: viewHistorique, echanges: viewEchanges, settings: viewSettings };

function render() {
  const app = $('#app');
  const ae = document.activeElement, fk = ae && (ae.dataset.f ? ['f', ae.dataset.f] : ae.hasAttribute && ae.hasAttribute('data-hq') ? ['hq', ''] : null), pos = fk && ae.selectionStart;
  if (!DB.users.length) { app.innerHTML = setupHTML(); return; }
  if (!S.user) { app.innerHTML = loginHTML(); return; }
  const nav = NAV.filter(n => n[2]()), v = nav.some(n => n[0] === S.view) ? S.view : 'dashboard';
  const nAl = computeAlerts().filter(a => a.sev === 'warn').length;
  const scroll = $('main') ? $('main').scrollTop : 0;
  app.innerHTML = `<header class="top noprint"><div class="brand"><b>🌸 Formidable</b><span>Planning des formations</span></div>${syncHTML()}<span class="sp"></span><button class="bell" data-act="goto" data-v="alertes" title="Alertes à traiter">🔔${nAl ? `<em>${nAl}</em>` : ''}</button><div class="who"><b>${esc(S.user.name)}</b><small>${ROLES[S.user.role]}</small></div><button class="btn ghost" data-act="logout">Quitter</button></header>
  <div class="shell"><nav class="side noprint">${nav.map(([k, l]) => `<button class="${k === v ? 'on' : ''}" data-act="goto" data-v="${k}">${l}${k === 'alertes' && nAl ? ` <em>${nAl}</em>` : ''}</button>`).join('')}</nav><main id="main">${VIEWS[v]()}</main></div>`;
  if (scroll && $('main')) $('main').scrollTop = scroll;
  if (fk) { const el = fk[0] === 'f' ? $(`[data-f="${fk[1]}"]`) : $('[data-hq]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } } }
  const fi = $('#xlsxIn'); if (fi) fi.value = '';
}

function setupHTML() {
  return `<div class="login"><form id="setupForm" class="card"><h1>🌸 Bienvenue dans Formidable</h1><p>Application de planification des formations. <b>Toutes les données restent sur votre poste</b> (ou dans le fichier que vous choisirez) : aucune connexion, aucun envoi.</p>
  <label class="f"><span>Votre nom (futur administrateur)</span><input name="name" required autofocus></label><label class="f"><span>Code personnel (facultatif, 4 caractères minimum)</span><input name="pin" type="password" autocomplete="new-password"></label><label class="f"><span>Nom de l'équipe (affiché sur les bilans)</span><input name="org"></label>
  <button class="btn primary" type="submit">Démarrer</button><hr><p class="muted">Vous rejoignez une équipe qui utilise déjà Formidable ?</p><div class="actions wrap">${FS_OK ? '<button type="button" class="btn" data-act="fssetup">Ouvrir le fichier de données partagé…</button>' : ''}<label class="btn">Restaurer une sauvegarde…<input type="file" id="restoreIn" accept=".json" hidden></label></div></form></div>`;

function loginHTML() {

}

/* ===== Événements ===== */
let TMR;
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  const a = el.dataset.act, v = el.dataset.v, id = el.dataset.id;
  try { await ACT[a]?.(el, v, id, e); } catch (err) { console.error(err); toast(String(err.message || err), 'err'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !CB) closeModal(); if (e.key === 'Enter' && e.target.matches('tr[data-act],.alert[data-act]')) e.target.click(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f !== undefined && t.type !== 'search') { curF()[t.dataset.f] = t.value; render(); }
  else if (t.dataset.c) { S.cal[t.dataset.c] = t.value; render(); }
  else if (t.id === 'xlsxIn') importFile(t.files[0]);
  else if (t.id === 'restoreIn') restoreFlow(t.files[0], !DB.users.length);
  else if (t.name === 'statut' && t.closest('#sf')) formSync();
  else if (t.name === 'modalite' && t.closest('#sf')) formSync();
  else if (t.id === 'optPast' || t.id === 'optDup') renderPreview();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f === 'q') { clearTimeout(TMR); TMR = setTimeout(() => { curF().q = t.value; render(); }, 250); }
  else if (t.hasAttribute('data-hq')) { clearTimeout(TMR); TMR = setTimeout(() => { S.hq = t.value; render(); }, 250); }
  else if (t.closest('#sf') && (t.name === 'date' || t.name === 'duree')) formSync();
});
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'sf') return saveSession(f);
  if (f.id === 'loginForm') {
    const u = DB.users.find(x => x.id === f.u.value), pin = f.pin.value;
    if (u && (!u.pin || (await hashPin(u.salt, pin)) === u.pin)) { S.user = u; sessionStorage.setItem('formidable.user', u.id); sessionStorage.setItem('formidable.last', u.id); S.view = 'dashboard'; render(); }
    else { $('#loginErr').textContent = 'Code incorrect.'; f.pin.value = ''; f.pin.focus(); }
  }
  if (f.id === 'setupForm') {
    const pin = f.pin.value; if (pin && pin.length < 4) return toast('Le code doit comporter au moins 4 caractères.', 'err');
    const u = await makeUser(f.name.value.trim(), 'admin', pin);
    DB.users.push(u); DB.settings.org = f.org.value.trim(); touchSettings(); S.user = u; sessionStorage.setItem('formidable.user', u.id); logH('Création', null, 'Initialisation de l\'application'); persist(); S.view = 'echanges'; render();
    toast('Application initialisée. Importez votre planning Excel ou créez une première session.');
  }
  if (f.id === 'edForm') return f.onsubmit2 && f.onsubmit2(f);
});

const ACT = {
  goto: (_, v) => { S.view = v; render(); $('main')?.scrollTo(0, 0); },
  logout: () => { S.user = null; sessionStorage.removeItem('formidable.user'); render(); },
  resetf: () => { delete S.F[S.view]; render(); },
  print: () => window.print(),
  sort: (_, v, __, e) => { const k = e.target.closest('[data-k]').dataset.k; S.sort = { k, d: S.sort.k === k ? -S.sort.d : 1 }; render(); },
  calmode: (_, v) => { S.cal.mode = v; render(); },
  caltoday: () => { S.cal.date = today(); render(); },
  calprev: () => calMove(-1), calnext: () => calMove(1),
  calgo: (el, v) => { S.cal.mode = v; S.cal.date = el.dataset.date; render(); },
  new: (el) => openSession(null, el.dataset.date),
  open: (el, v, id) => openSession(id),
  close: () => closeModal(),
  fssetup: async () => { await fileLink(false); S.user = null; render(); },
  fsauth: () => fileReauth(),
  fslink: async (_, v) => { await fileLink(v === 'new'); toast('Fichier partagé lié.'); render(); },
  fsunlink: async () => { await fileUnlink(); render(); },
  /* planning */
  exportSessions: () => dlXlsx([{ name: 'Sessions', rows: [SESSION_COLS, ...sortedSessions(filtered()).map(sessionRow)] }], 'sessions'),
  exportBilan: () => exportBilan(),
  exportBy: (_, v) => exportBy(v),
  exportIcs: () => download(icsFor(sortedSessions(filtered()).filter(s => s.statut !== 'reportee')), 'planning-formations.ics'),
  exportHist: () => dlXlsx([{ name: 'Historique', rows: [['Date', 'Utilisateur', 'Action', 'Session', 'Détail'], ...DB.history.slice().reverse().map(h => [new Date(h.ts).toLocaleString('fr-FR'), h.user, h.action, h.label, h.detail])] }], 'historique'),
  /* fiche */
  calcDuree: () => { const f = $('#sf'), a = t2m(f.debut.value), b = t2m(f.fin.value); if (a === null || b === null || b <= a) return toast('Renseignez des horaires valides.', 'err'); f.duree.value = Math.round((b - a) / 15) / 4; formSync(); },
  preset: (el) => { $('#sf').duree.value = el.dataset.h; formSync(); },
  addDate: () => { const v = $('#xd').value; if (!v) return; (S.xd ||= []); if (!S.xd.includes(v)) S.xd.push(v); S.xd.sort(); $('#xd').value = ''; xdRender(); },
  rmDate: (el, v) => { S.xd = S.xd.filter(x => x !== v); xdRender(); },
  quick: (_, v) => {
    const f = $('#sf'); f.statut.value = v; formSync();
    if (v === 'realisee') { if (!f.dureeReelle.value) f.dureeReelle.value = f.duree.value; $('#sect-public').open = true; f.presents.focus(); }
    else { if (!f.dateDecision.value) f.dateDecision.value = today(); f.motif.focus(); }
  },
  dup: () => { const s = DB.sessions.find(x => x.id === S.cur); closeModal(); openSession(null, '', { ...structuredClone(s), id: uid(), date: '', statut: 'planifiee', dureeReelle: null, presents: null, motif: '', dateDecision: '', nouvelleDate: '', decisionPar: '', groupeId: '', remplaceId: '', suppIntervenu: false }); },
  del: async () => { const s = DB.sessions.find(x => x.id === S.cur); if (!await confirmBox(`Supprimer définitivement « ${sessionLabel(s)} » ? (Préférez le statut « Annulée » pour conserver la trace.)`, 'Supprimer', true)) return; DB.sessions = DB.sessions.filter(x => x.id !== s.id); DB.del[s.id] = new Date().toISOString(); logH('Suppression', s, 'Session supprimée'); persist(); closeModal(); render(); },
  mail: () => { const s = DB.sessions.find(x => x.id === S.cur), to = involved(s).map(i => (A(i) || {}).email).filter(Boolean).join(';'); const body = `Bonjour,\n\nSession : ${s.titre || typeName(s.typeId)}\nDate : ${fmtDate(s.date)}${s.debut ? ' de ' + s.debut + (s.fin ? ' à ' + s.fin : '') : ''}\nLieu : ${lieuName(s) || 'à définir'}${s.lienVisio ? '\nLien : ' + s.lienVisio : ''}\nStatut : ${ST[s.statut].label}${s.motif ? '\nMotif : ' + s.motif : ''}${s.nouvelleDate ? '\nNouvelle date : ' + fmtDate(s.nouvelleDate) : ''}\nTitulaire : ${animName(s.titulaireId) || '—'}${s.suppleantId ? '\nSuppléant : ' + animName(s.suppleantId) : ''}\n\nCordialement,\n${S.user.name}`; location.href = `mailto:${to}?subject=${encodeURIComponent('Formation – ' + (s.titre || typeName(s.typeId)) + ' – ' + fmtShort(s.date))}&body=${encodeURIComponent(body)}`; },
  ics1: () => { const s = DB.sessions.find(x => x.id === S.cur); download(icsFor([s]), 'formation.ics'); },
  /* paramètres */
  settab: (_, v) => { S.setTab = v; render(); },
  edit: (el) => editDialog(el.dataset.k, el.dataset.id),
  rm: (el) => removeItem(el.dataset.k, el.dataset.id),
  merge: (el) => mergeDialog(el.dataset.k, el.dataset.id),
  listadd: (el) => { const k = el.dataset.k, v = $('#add-' + k).value.trim(); if (!v || DB.settings[k].includes(v)) return; DB.settings[k].push(v); touchSettings(); persist(); render(); },
  listdel: (el) => { DB.settings[el.dataset.k].splice(+el.dataset.i, 1); touchSettings(); persist(); render(); },
  listren: async (el) => {
    const k = el.dataset.k, i = +el.dataset.i, old = DB.settings[k][i], nv = await promptBox('Nouvelle valeur', old); if (!nv || nv === old) return;
    DB.settings[k][i] = nv; touchSettings();
    if (k === 'themes') DB.sessions.forEach(s => { if (s.theme === old) { s.theme = nv; stamp(s); } });
    if (k === 'populations') DB.sessions.forEach(s => { if (s.population === old) { s.population = nv; stamp(s); } });
    if (k === 'equipes') DB.animateurs.forEach(a => { if (a.equipe === old) { a.equipe = nv; stamp(a); } });
    persist(); render();
  },
  saveGeneral: () => { DB.settings.org = $('#set-org').value.trim(); DB.settings.alertDays = Math.max(1, +$('#set-days').value || 7); touchSettings(); persist(); toast('Enregistré.'); render(); },
  wipe: async () => { if (!await confirmBox('Effacer TOUTES les données de ce navigateur ? Pensez à télécharger une sauvegarde avant.', 'Tout effacer', true)) return; localStorage.removeItem(KEY); await fileUnlink(); DB = newDB(); S.user = null; sessionStorage.clear(); render(); },
  backup: async () => { const pw = $('#bkpw').value; const data = pw ? await encryptJSON(DB, pw) : DB; download(new Blob([JSON.stringify(data)], { type: 'application/json' }), `formidable-sauvegarde-${today()}${pw ? '-chiffree' : ''}.json`); toast(pw ? 'Sauvegarde chiffrée téléchargée.' : 'Sauvegarde téléchargée (non chiffrée).'); },
  doImport: () => doImport()
};
function calMove(n) {
  const c = S.cal, d = parseISO(c.date);
  if (c.mode === 'day') c.date = addDays(c.date, n); else if (c.mode === 'week') c.date = addDays(c.date, 7 * n);
  else if (c.mode === 'year') { d.setFullYear(d.getFullYear() + n); c.date = toISO(d); } else { d.setDate(1); d.setMonth(d.getMonth() + n); c.date = toISO(d); }
  render();
}
function dlXlsx(sheets, name) { download(buildXlsx(sheets), `${name}-${today()}.xlsx`); toast('Export Excel généré.'); }

/* ===== Exports ===== */
function exportBilan() {
  const list = filtered(), r = stats(list), pct = x => x === null ? '' : Math.round(x * 1000) / 10;
  const rows = o => Object.values(o).sort((a, b) => b.hReal - a.hReal || b.hPrev - a.hPrev).map(e => [e.name, e.prev, e.real, e.ann, e.rep, e.hPrev, e.hReal]);
  const H = n => [n, 'Sessions prévues', 'Sessions réalisées', 'Annulées', 'Reportées', 'Heures prévues', 'Heures réalisées'];
  dlXlsx([
    { name: 'Synthèse', rows: [['Indicateur', 'Valeur'], ['Période', periodLabel()], ['Entité', DB.settings.org], ['Sessions au total', r.n], ['À planifier', r.st.a_planifier], ['Planifiées', r.st.planifiee], ['Confirmées', r.st.confirmee], ['Réalisées', r.st.realisee], ['Reportées', r.st.reportee], ['Annulées', r.st.annulee], ['Heures planifiées (hors annulées/reportées)', r.hPlan], ['Heures réalisées', r.hReal], ['Participants prévus (sessions réalisées)', r.prevus], ['Participants présents', r.presents], ['Taux de participation (%)', pct(r.taux)], ['Édité le', new Date().toLocaleString('fr-FR')]] },

  const src = k === 'lieu' ? L(id) : A(id), list = (k === 'lieu' ? lieuOpts() : animOpts(true)).filter(x => x[0] !== id);
  if (!list.length) return toast('Aucun autre élément vers lequel fusionner.', 'err');
  const m = modal(`<form id="edForm"><div class="mhead"><h2>Fusionner « ${esc(src.name)} »</h2><button type="button" class="x" data-act="close">✕</button></div><div class="mbody"><p>Toutes les sessions de « ${esc(src.name)} » seront rattachées à l'élément choisi, puis « ${esc(src.name)} » sera supprimé (son nom devient un alias pour un lieu).</p><label class="f"><span>Fusionner dans</span><select name="to">${opts(list)}</select></label></div><div class="mfoot"><span class="sp"></span><button type="button" class="btn" data-act="close">Annuler</button><button class="btn primary">Fusionner</button></div></form>`, 'small');
  $('#edForm').onsubmit2 = f => {
    const to = f.to.value;
    DB.sessions.forEach(s => { let ch = false; if (k === 'lieu' && s.lieuId === id) { s.lieuId = to; ch = true; } if (k === 'anim') { ['titulaireId', 'suppleantId'].forEach(p => { if (s[p] === id) { s[p] = to; ch = true; } }); if ((s.coanim || []).includes(id)) { s.coanim = [...new Set(s.coanim.map(x => x === id ? to : x))]; ch = true; } } if (ch) stamp(s); });
    if (k === 'lieu') { const t = L(to); t.aliases = [...new Set([...(t.aliases || []), src.name, ...(src.aliases || [])])]; stamp(t); DB.lieux = DB.lieux.filter(x => x.id !== id); } else DB.animateurs = DB.animateurs.filter(x => x.id !== id);
    DB.del[id] = new Date().toISOString(); persist(); closeModal(); render(); toast('Fusion effectuée.');
  };
}

/* ===== Import Excel ===== */
async function importFile(file) {
  if (!file) return;
  try { S.parsed = parseNeo(await readXlsx(await file.arrayBuffer())); S.parsed.file = file.name; renderPreview(); }
  catch (e) { $('#impPreview').innerHTML = `<p class="err">${esc(e.message || e)}</p>`; }
}
function renderPreview() {
  const P = S.parsed, box = $('#impPreview'); if (!box || !P) return;
  const o = { pastDone: $('#optPast') ? $('#optPast').checked : true, skipDup: $('#optDup') ? $('#optDup').checked : true };
  if (!P.rows.length) { box.innerHTML = `<p class="err">Aucune session trouvée. ${esc(P.warn.join(' '))}</p>`; return; }
  const backup = structuredClone(DB); let rep; try { rep = applyNeo(P, o); } finally { DB = backup; }
  const lm = Object.entries(rep.lieuMap), canc = P.rows.filter(r => r.annulee).length;
  box.innerHTML = `<div class="info"><b>${esc(P.file)}</b> : ${P.rows.length} session(s) détectée(s) (${canc} annulée(s)) du ${fmtShort(P.rows.map(r => r.date).sort()[0])} au ${fmtShort(P.rows.map(r => r.date).sort().pop())}.<br>Seront ajoutées : <b>${rep.added}</b>${rep.dup ? ` · ignorées (déjà présentes) : ${rep.dup}` : ''}.<br>Nouveaux animateurs : ${rep.newAnim.map(esc).join(', ') || 'aucun'}<br>Nouveaux types : ${rep.newType.map(esc).join(', ') || 'aucun'}<br>Nouveaux lieux : ${rep.newLieu.map(esc).join(', ') || 'aucun'}</div>
  ${lm.length ? `<details open><summary>Harmonisation des lieux (variantes d'orthographe regroupées)</summary><table class="tbl"><thead><tr><th>Lieu retenu</th><th>Orthographes rencontrées dans le fichier</th></tr></thead><tbody>${lm.map(([n, set]) => `<tr><td>${esc(n)}</td><td>${[...set].map(esc).join(' · ')}</td></tr>`).join('')}</tbody></table></details>` : ''}
  ${P.notes.length ? `<p class="muted">${P.notes.length} commentaire(s) d'animateur seront ajoutés à leur fiche. Les commentaires de session sont repris dans le champ « Commentaires ».</p>` : ''}
  <label class="chk"><input type="checkbox" id="optPast"${o.pastDone ? ' checked' : ''}> Marquer les sessions passées (avant aujourd'hui) comme « Réalisées »</label><label class="chk"><input type="checkbox" id="optDup"${o.skipDup ? ' checked' : ''}> Ignorer les sessions déjà présentes (même date, type, lieu et animateur)</label>
  <div class="actions"><button class="btn primary" data-act="doImport">Importer ${rep.added} session(s)</button></div>`;
}
function doImport() {
  const o = { pastDone: $('#optPast').checked, skipDup: $('#optDup').checked }, rep = applyNeo(S.parsed, o);
  S.parsed = null; persist(); S.F.sessions = { scope: '' }; S.view = 'sessions'; render(); toast(`${rep.added} session(s) importée(s).`);
}

/* ===== Restauration ===== */
async function restoreFlow(file, fromSetup) {
  if (!file) return;
  try {
    let data = JSON.parse(await file.text());
    if (data.fmt === 'formidable-enc') { const pw = await promptBox('Mot de passe de la sauvegarde', '', 'password'); if (!pw) return; try { data = await decryptJSON(data, pw); } catch (e) { throw new Error('Mot de passe incorrect.'); } }
    if (!data.sessions || !data.settings) throw new Error('Ce fichier n\'est pas une sauvegarde Formidable.');
    let merge = false;
    if (!fromSetup && DB.sessions.length + DB.users.length) merge = await confirmBox(`Fusionner la sauvegarde avec les données actuelles ? (Annuler = ne rien faire.) Pour remplacer entièrement, utilisez d'abord « Réinitialiser l'application » dans Paramètres.`, 'Fusionner');
    if (!fromSetup && !merge) return;
    DB = merge ? mergeDB(DB, data) : data; persist(); S.user = null; sessionStorage.removeItem('formidable.user'); render(); toast('Sauvegarde restaurée.');
  } catch (e) { toast(e.message || String(e), 'err'); }
}

/* ===== Démarrage ===== */
(async function init() {
  loadDB(); await fileInit();
  const uidS = sessionStorage.getItem('formidable.user'); if (uidS) S.user = DB.users.find(u => u.id === uidS) || null;
  window.addEventListener('focus', () => fileCheck());
  setInterval(() => { if (!document.hidden && !$('.overlay')) fileCheck(); }, 30000);
  render();
})();
</script>
</body>
